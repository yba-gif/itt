# Production docker-compose for Hetzner Cloud VPS.
# Usage:
#   1) DNS A-records: api.${DOMAIN} and admin.${DOMAIN} -> VPS IP
#   2) Copy .env.prod to /opt/itt/.env (fill in all required values).
#   3) cd /opt/itt && docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# Required env vars: DOMAIN, LETSENCRYPT_EMAIL, POSTGRES_PASSWORD, APP_SECRET,
#   ADMIN_SEED_EMAIL, ADMIN_SEED_PASSWORD, S3_* (Cloudflare R2 or MinIO).
# Optional: SMTP_*, APNS_*, SENTRY_DSN.
#
# Notes:
#  - DOMAIN defaults to itt-rehber.ch — override in .env for test deploys.
#  - TLS: Traefik issues Let's Encrypt certs automatically on first request.
#  - Scheduled tasks: scheduler service runs expire-and-remind.py daily at 03:00.

services:
  traefik:
    image: traefik:v2.11
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      - "--certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../apps/backend/alembic/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s

  backend:
    image: ghcr.io/itt-rehber/backend:latest # set up CI to publish; for now build locally
    build: ../../apps/backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_ENV: production
      APP_SECRET: ${APP_SECRET}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-2592000}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID}
      SENTRY_DSN: ${SENTRY_DSN}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD}
      CORS_ORIGINS: https://${DOMAIN:-itt-rehber.ch},https://admin.${DOMAIN:-itt-rehber.ch},https://api.${DOMAIN:-itt-rehber.ch}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL} # https://<account>.r2.cloudflarestorage.com
      S3_REGION: auto
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL} # cloudflare custom domain or r2 public URL
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed.run &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.${DOMAIN:-itt-rehber.ch}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=le"
      - "traefik.http.services.api.loadbalancer.server.port=8000"

  admin:
    build:
      context: ../../apps/admin
      args:
        VITE_API_URL: https://api.${DOMAIN:-itt-rehber.ch}
    restart: unless-stopped
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`admin.${DOMAIN:-itt-rehber.ch}`)"
      - "traefik.http.routers.admin.entrypoints=websecure"
      - "traefik.http.routers.admin.tls.certresolver=le"
      - "traefik.http.services.admin.loadbalancer.server.port=80"

  # Runs expire-and-remind.py daily at 03:00 Europe/Zurich.
  # supercronic (https://github.com/aptible/supercronic) is a cron runner built for
  # containers: handles SIGTERM cleanly, logs to stdout, no setuid/setgid required.
  scheduler:
    image: ghcr.io/itt-rehber/backend:latest
    build: ../../apps/backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_ENV: production
      APP_SECRET: ${APP_SECRET}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID}
      SENTRY_DSN: ${SENTRY_DSN}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_REGION: auto
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-ITT-Rehber}
    volumes:
      - ../../scripts:/app/scripts:ro
    command: python /app/scripts/scheduler.py --hour 3 --minute 0

volumes:
  postgres-data:
  traefik-letsencrypt:
