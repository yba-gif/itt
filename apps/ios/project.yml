name: ITTRehber
options:
  bundleIdPrefix: ch.itt-rehber
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: tr
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "YT734G2394"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: ch.itt-rehber.app
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic

targets:
  ITTRehber:
    type: application
    platform: iOS
    sources:
      - path: ITTRehber
    entitlements:
      path: ITTRehber/ITTRehber.entitlements
      properties:
        # Push sandbox in dev. Real APNs delivery needs a provisioning
        # profile — until that's wired, registerForRemoteNotifications()
        # fails silently and the device-token register is a no-op.
        aps-environment: production
    info:
      path: ITTRehber/Info.plist
      properties:
        CFBundleDisplayName: "TGS-ITT Rehber"
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "24"
        CFBundleLocalizations: [tr]
        CFBundleDevelopmentRegion: tr
        CFBundleIconName: "AppIcon"
        ITSAppUsesNonExemptEncryption: false
        ITTAPIBaseURL: "https://api.clawdcloud.xyz"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        LSApplicationCategoryType: "public.app-category.reference"
        NSCalendarsUsageDescription: "Etkinlik hatırlatmaları takviminize eklenir."
        NSCalendarsWriteOnlyAccessUsageDescription: "Etkinlik hatırlatmaları takviminize eklenir."
        NSContactsUsageDescription: "İletişim bilgileri için kullanılır."
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true

  ITTRehberTests:
    type: bundle.unit-test
    platform: iOS
    sources: ITTRehberTests
    dependencies:
      - target: ITTRehber
