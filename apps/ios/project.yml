name: ITTRehber
options:
  bundleIdPrefix: ch.itt-rehber
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: tr
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: ch.itt-rehber.app
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  ITTRehber:
    type: application
    platform: iOS
    sources:
      - path: ITTRehber
    info:
      path: ITTRehber/Info.plist
      properties:
        CFBundleDisplayName: "ITT-Rehber"
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleLocalizations: [tr]
        CFBundleDevelopmentRegion: tr
        ITTAPIBaseURL: "http://localhost:8000"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSApplicationCategoryType: "public.app-category.reference"
        NSCalendarsUsageDescription: "Etkinlik hatırlatmaları takviminize eklenir."
        NSCalendarsWriteOnlyAccessUsageDescription: "Etkinlik hatırlatmaları takviminize eklenir."
        NSContactsUsageDescription: ""
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true

  ITTRehberTests:
    type: bundle.unit-test
    platform: iOS
    sources: ITTRehberTests
    dependencies:
      - target: ITTRehber
