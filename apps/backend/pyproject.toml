[project]
name = "itt-backend"
version = "0.1.0"
description = "ITT-Rehber 2.0 backend (FastAPI + Postgres)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0.27",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.8",
    "cryptography>=42.0",
    "httpx>=0.27",
    "boto3>=1.34",
    "sentry-sdk[fastapi]>=1.40",
    "email-validator>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.19",
    "ruff>=0.3",
    "black>=24.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
